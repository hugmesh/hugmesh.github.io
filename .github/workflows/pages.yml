# Build and deploy the HugMesh documentation site to GitHub Pages.
#
# This replaces a workflow that uploaded `./site` — a single hand-written static page.
# The site is now an Angular application whose pages are generated from the Markdown
# vendored under `content/`, so the artifact has to be built rather than copied.
#
# TRIGGER: `push` to main, unlike the fleet's workflow_dispatch-only convention. That
# convention exists for the 25 GHCR image-push workflows, where an accidental run
# publishes an image; here the "side effect" is that the documentation matches main,
# which is the entire point. workflow_dispatch stays for manual re-deploys.
#
# CURRENT STATE (decisions 115a = C and 115b = D, 2026-09-23): the repository stays
# private and Pages is not enabled, so this workflow is a BUILD-ONLY gate. A green run
# means "built and the Pages artifact verified"; the `deploy` job is SKIPPED by design
# on every run, and a skipped deploy is not a deployed site. Nothing is published.
#
# PREREQUISITES to deploy, should the decision ever be revisited; all one-time and all
# outside this file:
#   1. the repository is public (Pages custom domains require it on this plan);
#   2. Settings -> Pages -> Source = "GitHub Actions";
#   3. custom domain hugmesh.net, with "Enforce HTTPS" once DNS resolves;
#   4. Cloudflare CNAME hugmesh.net -> hugmesh.github.io and www -> the same, DNS-only.
# The ordered runbook with the exact record values, the decided www alias, the reason the
# Cloudflare proxy has to stay OFF until GitHub has issued the certificate, the cache
# rules the unhashed assets/content/ payload needs, and the verification transcript that
# closes hugmesh.github.io#15, is docs/go-live-cloudflare.md.
# The CNAME file in src/ is copied into the artifact by the build; losing it silently
# unbinds the domain, so scripts/spa-fallback.mjs asserts it is present.
#
# RELEASE DATA (the Downloads page). The page reads assets/releases.json, and nobody
# writes that file by hand: the "Fetch release data" step below builds it on every run
# from the GitHub Releases API (Studio, hugmesh-generator `studio-v*` tags) and the
# GHCR registry (every image in release-sources.json), anonymously apart from this
# workflow's own token. So the site must be rebuilt whenever something is published.
# Three triggers do that, none of which needs a secret in THIS repository:
#   * repository_dispatch `releases-updated`: sent by the release workflows in the other
#     repos as their last step. GITHUB_TOKEN cannot dispatch across repositories, so
#     the SENDER needs a secret SITE_DISPATCH_TOKEN (a fine-grained token or GitHub App
#     token with Contents: read and write on hugmesh/hugmesh.github.io). Until that
#     secret exists the senders skip the call with a notice, and:
#   * schedule, hourly: the fallback that works with no secret anywhere. GitHub runs
#     scheduled workflows only from the default branch, may start them late, and
#     DISABLES them in a public repository after 60 days without a commit; re-enable
#     from the Actions tab if that happens.
#   * workflow_dispatch: a person asks for a refresh.
# The payload of a dispatch is never trusted: the fetch step re-reads GitHub itself.
#
# THE PROJECT BOARD (the Project board page). The page reads assets/board.json, which
# the "Fetch the project board" step below builds on every run from the organisation's
# GitHub Project. That is the one thing here that needs a secret IN THIS REPOSITORY:
# BOARD_READ_TOKEN, a token that can read Projects and nothing else (the README says
# how to make it and where to put it). Without it the build still passes and the page
# says the board is not shown here. The hourly run redeploys when the board changed,
# exactly as it does for a release.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  repository_dispatch:
    types: [releases-updated]
  schedule:
    - cron: '17 * * * *'

# LEAST PRIVILEGE, per job. Nothing at workflow level, so a job that forgets its own
# block gets no token scopes at all rather than inheriting write ones.
#   build:  contents: read (checkout) and pages: read (the probe step, the hourly
#           "changed" step and configure-pages only GET /repos/{repo}/pages;
#           configure-pages writes only with `enablement: true`, which is not set).
#           It runs npm ci, the release fetch and ng build hourly and on every
#           dispatch, so it must never hold a write scope or an OIDC token.
#           Its one secret, BOARD_READ_TOKEN, is not a token scope: it is handed to
#           a single step, in that step's environment, before npm ci has run.
#   deploy: pages: write and id-token: write, nothing else; it runs no repository code.
# Uploading the Pages artifact and deploy-pages' artifact lookup use the Actions
# runtime token, not GITHUB_TOKEN, so neither job needs `actions: read`.
# scripts/pages-workflow.test.mjs (part of `npm test`) fails if any of this regresses.
permissions: {}

concurrency:
  group: pages
  # NOT cancel-in-progress: cancelling a half-finished deploy can leave Pages serving
  # a partially-updated site. A superseded run costs a minute; a broken site does not.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      pages_ready: ${{ steps.probe.outputs.ready }}
      data_changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Fetch the project board (read-only, before any dependency is installed)
        # Writes src/assets/board.json for the Project board page; the build copies it
        # to assets/. An organisation Project cannot be read with this workflow's own
        # token, so this is the ONE step that is handed a secret: BOARD_READ_TOKEN, a
        # token that can only read Projects (README, "The project board").
        #
        # It runs HERE, before `npm ci`, on purpose. Nothing from node_modules has
        # run yet, and the script imports only Node itself and files of this
        # repository, so no third-party code is ever in a process that holds the
        # token. The token is in the environment of this step alone: never an
        # argument, never echoed, and no later step can read it.
        #
        # This step does not fail the build over the board. With no secret (a fork,
        # or this repository until the secret is added) it writes a small file that
        # says "unavailable", and the page says the board is not shown here and
        # links to GitHub. If the board cannot be read WHOLE it does the same and
        # emits a ::warning::, because half a board must never be published as if it
        # were all of it. Items from a repository that is not public are left out
        # and counted; the script header lists exactly what is published.
        env:
          BOARD_READ_TOKEN: ${{ secrets.BOARD_READ_TOKEN }}
        run: node scripts/fetch-board.mjs

      - run: npm ci

      - name: Verify content integrity
        # BLOCKING, and it means something on a bare runner: it verifies every file
        # under content/ against content/.sync.lock.json — no network, no sibling
        # checkouts, no credential. It fails if a vendored document was hand-edited,
        # if an unlisted file appeared under content/, if the lock is missing or
        # covers nothing, or if a page the manifest promises is absent. Every one of
        # those is a failure rather than a skip: a gate that can report "nothing to
        # check" and still pass is not a gate.
        run: npm run check:integrity

      - name: Check the vendored content against upstream
        # ADVISORY, and it can only ever be. This compares content/ against sibling
        # code repositories that are PRIVATE and not checked out here, so it reports
        # "unreachable" and exits 0 on this runner. It is kept because it becomes
        # meaningful the day the repositories are public, and because the same
        # command is the maintainer's pre-commit check. The integrity gate above is
        # what actually protects the site.
        run: npm run check:content
        continue-on-error: true

      - name: Check site-written pages against upstream
        # ADVISORY here: a deploy must not wait on it. It fetches each upstream file
        # a site-written page was checked against (public repositories, no
        # credential) and warns when one has changed since, naming the page to
        # re-read. ci.yml runs the same command on every pull request.
        run: npm run check:basis
        continue-on-error: true

      - name: Fetch release data (Studio releases, GHCR images)
        # Writes src/assets/releases.json; the build copies it to assets/. Not-yet-
        # published items (404, or a package the registry will not list anonymously)
        # are written as "not published", which is what a visitor would see. A
        # timeout, a 5xx, a rate limit or a checksum that disagrees with GitHub's own
        # digest FAILS this step after retries: the deploy is then skipped and the
        # live site keeps its previous, still-correct data. The token only raises the
        # API rate limit; it reads public repositories, as any visitor could.
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run fetch:releases

      - name: Build
        # prebuild renders content/ -> src/assets/content; postbuild writes the SPA
        # fallback, .nojekyll and asserts the CNAME survived.
        run: npm run build

      - name: Verify the Pages artifact
        # GitHub Pages has no rewrite rules: a cold load of any deep link is served
        # 404.html. If that file is not a byte-copy of index.html, every deep link
        # into the documentation is broken — and it would be broken ONLY in
        # production, where nothing else exercises it. Cheap to assert, expensive to
        # discover.
        run: |
          cd dist/browser
          for f in index.html 404.html CNAME .nojekyll; do
            [ -f "$f" ] || { echo "::error::$f missing from the Pages artifact"; exit 1; }
          done
          if ! cmp -s index.html 404.html; then
            echo "::error::404.html is not a copy of index.html — deep links will 404"
            exit 1
          fi
          pages=$(find assets/content -name '*.json' | wc -l)
          echo "404 fallback OK · CNAME $(cat CNAME) · $pages content files"
          [ "$pages" -gt 10 ] || { echo "::error::content payload looks empty"; exit 1; }
          # The Downloads page's data must be in the artifact and must be what the page
          # can read (the same validator the page runs).
          [ -f assets/releases.json ] || { echo "::error::assets/releases.json missing from the Pages artifact"; exit 1; }
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { validateReleaseData } from '../../src/app/downloads/release-data.ts';
            const data = JSON.parse(readFileSync('assets/releases.json', 'utf8'));
            const errors = validateReleaseData(data);
            if (errors.length) { for (const e of errors) console.log('::error::releases.json: ' + e); process.exit(1); }
            const n = data.images.filter((i) => i.version).length;
            console.log('releases.json OK · Studio ' + (data.studio ? data.studio.version : 'not published') + ' · images ' + n + '/' + data.images.length + ' published');
          "
          # The Project board page's data must be in the artifact too, and must be what
          # the page can read (the same validator). A file that says "unavailable" is
          # valid: the page then says the board is not shown here.
          [ -f assets/board.json ] || { echo "::error::assets/board.json missing from the Pages artifact"; exit 1; }
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { validateBoardData } from '../../src/app/board/board-data.ts';
            const data = JSON.parse(readFileSync('assets/board.json', 'utf8'));
            const errors = validateBoardData(data);
            if (errors.length) { for (const e of errors) console.log('::error::board.json: ' + e); process.exit(1); }
            console.log('board.json OK · ' + (data.state === 'ok' ? data.items.length + ' items' : 'not published (' + data.reason + ')'));
          "

      - id: probe
        name: Is Pages configured on this repository?
        # The site cannot deploy until somebody sets Settings -> Pages -> Source =
        # "GitHub Actions" (and makes the repo public, for the custom domain). That
        # is deliberately an OPERATOR decision — publishing a site is outward-facing,
        # and `configure-pages` has an `enablement` flag that would do it silently.
        # We do not use it.
        #
        # But we also do not let the workflow sit permanently red waiting for that: a
        # main branch that always fails is a signal people stop reading, and it would
        # mask a genuine build break. So the prerequisite is PROBED, the deploy is
        # skipped with an explicit summary saying what is missing, and the build above
        # still runs as a real gate on every push.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Pages is configured — deploying."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo '## Site built, not deployed'
              echo
              echo 'GitHub Pages is not enabled on this repository, so the deploy job was skipped. This is the expected state while the repository stays private (decisions 115a = C and 115b = D): nothing is published.'
              echo 'The build itself passed and the artifact was verified.'
              echo
              echo 'Only if that decision is revisited, to publish, once:'
              echo
              echo '1. Make the repository **public** (Pages custom domains require it on this plan).'
              echo '2. Settings → Pages → Source = **GitHub Actions**.'
              echo '3. Set the custom domain to `hugmesh.net`, and enable Enforce HTTPS once DNS resolves.'
              echo '4. Add Cloudflare `CNAME`s `hugmesh.net` and `www` → `hugmesh.github.io`, DNS-only.'
              echo
              echo 'Exact record values, ordering and the verification transcript are in'
              echo '`docs/go-live-cloudflare.md` in this repository. Note step 4: the'
              echo 'Cloudflare proxy must stay OFF until GitHub has issued the certificate.'
              echo
              echo 'The next push to `main` will then deploy.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Pages is not enabled on this repository (expected while it stays private, decision 115) — built and verified, deploy skipped by design."
          fi

      - id: changed
        name: On the hourly run, did the release data or the board change?
        # A scheduled run exists only to pick up new releases and board changes. If
        # what it fetched equals what the live site already serves (ignoring the
        # generation times), do not redeploy an identical site every hour. Any doubt
        # (a live file unreachable or unparsable, the script failing) counts as
        # changed, so the failure mode is one redundant deploy, never a missed
        # release. The rule, and its one exception (a build that could not reach
        # GitHub for the board does not replace a good live board), is
        # scripts/published-data-changed.mjs.
        if: github.event_name == 'schedule' && steps.probe.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url)"
          live="$RUNNER_TEMP/live"
          mkdir -p "$live"
          for f in releases.json board.json; do
            curl -fsSL --max-time 30 "${base%/}/assets/$f" -o "$live/$f" || rm -f "$live/$f"
          done
          if node scripts/published-data-changed.mjs "$live" dist/browser/assets; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release data and project board unchanged since the last deploy; skipping this hourly deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
        if: steps.probe.outputs.ready == 'true' && steps.changed.outputs.changed != 'false'

      - uses: actions/upload-pages-artifact@v3
        if: steps.probe.outputs.ready == 'true' && steps.changed.outputs.changed != 'false'
        with:
          path: dist/browser

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true' && needs.build.outputs.data_changed != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
