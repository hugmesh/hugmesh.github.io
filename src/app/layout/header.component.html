<div class="bar">
  <a class="brand" routerLink="/" (click)="closeMenu()">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">HugMesh<span class="brand-sub">docs</span></span>
  </a>

  <button
    class="menu-toggle"
    type="button"
    data-testid="menu-toggle"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="primary-nav"
    (click)="toggleMenu()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="22" height="22">
      @if (menuOpen()) {
        <path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41Z" />
      } @else {
        <path fill="currentColor" d="M3 6h18v2H3V6Zm0 5h18v2H3v-2Zm0 5h18v2H3v-2Z" />
      }
    </svg>
    <span class="sr">{{ menuOpen() ? 'Close navigation' : 'Open navigation' }}</span>
  </button>

  <nav id="primary-nav" class="primary" [class.open]="menuOpen()" aria-label="Documentation sections">
    <ul>
      @for (section of sections; track section.id) {
        <li>
          <a
            class="nav-link"
            [routerLink]="['/', section.id]"
            routerLinkActive="active"
            [attr.data-testid]="'nav-' + section.id"
            (click)="closeMenu()"
            >{{ section.navLabel }}</a
          >
        </li>
      }
    </ul>
  </nav>

  <form class="search" role="search" (submit)="submitSearch($event, q.value)">
    <label class="sr" for="header-search">Search the documentation</label>
    <input
      #q
      id="header-search"
      type="search"
      name="q"
      placeholder="Search docs…"
      autocomplete="off"
      data-testid="header-search"
    />
    <button type="submit">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="18" height="18">
        <path
          fill="currentColor"
          d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"
        />
      </svg>
      <span class="sr">Search</span>
    </button>
  </form>

  <!-- The one action most visitors came for, on every page and at every width:
       it never folds into the menu. -->
  <a
    class="dl-cta"
    routerLink="/downloads"
    routerLinkActive="active"
    data-testid="header-download"
    (click)="closeMenu()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="18" height="18">
      <path fill="currentColor" d="M5 20h14v-2H5v2Zm7-3 6-6-1.41-1.41L13 13.17V4h-2v9.17L7.41 9.59 6 11l6 6Z" />
    </svg>
    <span>Download</span>
  </a>

  <a
    class="gh"
    href="https://github.com/hugmesh"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="HugMesh on GitHub (opens in a new tab)"
  >
    <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" focusable="false">
      <path
        fill="currentColor"
        fill-rule="evenodd"
        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
      />
    </svg>
  </a>
</div>
